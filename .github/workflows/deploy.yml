name: Deploy

# Publishes each push to main as a GitHub release. The server pulls it from
# there (deploy/README.md), so this workflow holds no credentials for the
# server and has no way to reach it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # create and prune releases, nothing else

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: deploy-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # VITE_GOOGLE_CLIENT_ID is baked into the web bundle at build time by Vite.
      - run: pnpm build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      - run: CI=true pnpm install --prod --frozen-lockfile

      # Same set of files the Dockerfile's runtime stage copies — see there
      # for why drizzle.config.ts/drizzle/ are needed alongside dist.
      # release.txt is what the server reads first: which commit is latest,
      # and the checksum the tarball must match.
      - name: Package release
        run: |
          mkdir -p out
          tar -czf out/portifo.tar.gz \
            pnpm-workspace.yaml package.json node_modules \
            packages/portifo-api/package.json \
            packages/portifo-api/node_modules \
            packages/portifo-api/dist \
            packages/portifo-api/drizzle.config.ts \
            packages/portifo-api/drizzle \
            packages/portifo-web/dist \
            deploy/migrate.sh
          {
            echo "commit=$GITHUB_SHA"
            echo "sha256=$(sha256sum out/portifo.tar.gz | cut -d' ' -f1)"
          } > out/release.txt
          cat out/release.txt

      # gh uploads the assets to a draft and publishes it after, so the
      # release webhook never fires before the files are there. A re-run, or a
      # manual run on a commit that's already out, has nothing to publish.
      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published"
            exit 0
          fi
          gh release create "$TAG" out/portifo.tar.gz out/release.txt \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Deploy ${GITHUB_SHA::7}" \
            --notes "$(git log -1 --format=%s)"

      - name: Keep the newest 5 deploy releases
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("deploy-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
