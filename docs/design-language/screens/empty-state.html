<title>Portifo — Design Language · Screens · Empty State</title>
<link rel="stylesheet" href="../foundations/fonts.css">
<link rel="stylesheet" href="../foundations/tokens.css">
<link rel="stylesheet" href="../foundations/base.css">

<div class="wrap">

  <div class="doc-top">
    <div>
      <span class="eyebrow">Portifo F7 · Design Language · Screens</span>
      <h1 class="doc-title">Empty State</h1>
    </div>
    <div class="theme-toggle" role="group" aria-label="Theme preview">
      <button class="theme-btn" onclick="setTheme(null,this)">System</button>
      <button class="theme-btn" onclick="setTheme('light',this)">Light</button>
      <button class="theme-btn" onclick="setTheme('dark',this)">Dark</button>
    </div>
  </div>

  <div class="grid">
      <div class="card screen-frame">
        <div class="stage">
          <div class="empty">
            <div class="empty-badge"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
            <div class="empty-title">No transactions yet</div>
            <div class="empty-body">Add your first buy, sell, deposit, or withdrawal to start tracking this portfolio.</div>
            <button class="btn btn-primary" style="margin-top:4px;">Add Your First Transaction</button>
          </div>
        </div>
        <div class="card-caption">Shared empty state — Holdings, Transactions, Accounts</div>
      </div>
  </div>

</div>

<script src="../foundations/theme-toggle.js"></script>
