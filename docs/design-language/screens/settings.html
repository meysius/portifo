<title>Portifo — Design Language · Screens · Settings</title>
<link rel="stylesheet" href="../foundations/fonts.css">
<link rel="stylesheet" href="../foundations/tokens.css">
<link rel="stylesheet" href="../foundations/base.css">

<div class="wrap">

  <div class="doc-top">
    <div>
      <span class="eyebrow">Portifo F7 · Design Language · Screens</span>
      <h1 class="doc-title">Settings</h1>
    </div>
    <div class="theme-toggle" role="group" aria-label="Theme preview">
      <button class="theme-btn" onclick="setTheme(null,this)">System</button>
      <button class="theme-btn" onclick="setTheme('light',this)">Light</button>
      <button class="theme-btn" onclick="setTheme('dark',this)">Dark</button>
    </div>
  </div>

  <div class="grid">
      <div class="card screen-frame">
        <div class="stage">
          <div class="divider" style="margin-bottom:0;"><span class="dl">Account</span><span class="dh"></span></div>
          <div class="pick-row"><div><div class="pick-name">me.feghhi@gmail.com</div><div class="pick-sub">Signed in with Google</div></div></div>
          <div class="divider" style="margin-bottom:0;"><span class="dl">Portfolio</span><span class="dh"></span></div>
          <div class="pick-row"><div><div class="pick-name">My Portfolio</div><div class="pick-sub">Active · 2 members</div></div><svg viewBox="0 0 7 12" fill="none" style="width:7px;height:12px;color:var(--fg-3)"><path d="M1 1L6 6L1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="divider" style="margin-bottom:0;"><span class="dl">Appearance</span><span class="dh"></span></div>
          <div class="seg-group"><div class="seg-item active">System</div><div class="seg-item">Light</div><div class="seg-item">Dark</div></div>
          <div class="btn-stack" style="margin-top:6px;"><button class="btn btn-secondary">Log Out</button></div>
        </div>
        <div class="card-caption">Settings</div>
      </div>
  </div>

</div>

<script src="../foundations/theme-toggle.js"></script>
