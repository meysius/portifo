<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breakdown — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-col"><span class="pv-cap">Five holdings or fewer</span><div class="pv-phone">
    <section class="ds-section"><div class="ds-section-heading" style="margin-bottom:13px"><h2>Breakdown</h2><span class="meta">All accounts</span></div>
    <div class="po-allocation-bar" role="img" aria-label="NVDA 34.3%, AAPL 25.3%, VTI 19.8%, AMD 7.7%, Cash 12.8%">
      <span class="po-allocation-segment" style="flex:34.3;background:var(--ds-hold-1)"></span>
      <span class="po-allocation-segment" style="flex:25.3;background:var(--ds-hold-2)"></span>
      <span class="po-allocation-segment" style="flex:19.8;background:var(--ds-hold-3)"></span>
      <span class="po-allocation-segment" style="flex:7.7;background:var(--ds-hold-4)"></span>
      <span class="po-allocation-segment" style="flex:12.8;background:var(--ds-cash)"></span>
    </div>
    <div class="po-allocation-legend" style="--legend-rows:3">
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-1)"></span><span class="po-legend-label">NVDA</span><span class="po-legend-percent money">34.3%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-2)"></span><span class="po-legend-label">AAPL</span><span class="po-legend-percent money">25.3%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-3)"></span><span class="po-legend-label">VTI</span><span class="po-legend-percent money">19.8%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-4)"></span><span class="po-legend-label">AMD</span><span class="po-legend-percent money">7.7%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-cash)"></span><span class="po-legend-label">Cash</span><span class="po-legend-percent money">12.8%</span></div>
    </div></section></div></div>
  <div class="pv-col"><span class="pv-cap">Past the fifth holding</span><div class="pv-phone">
    <section class="ds-section"><div class="ds-section-heading" style="margin-bottom:13px"><h2>Breakdown</h2><span class="meta">All accounts</span></div>
    <div class="po-allocation-bar" role="img" aria-label="NVDA 25.8%, AAPL 19.1%, VTI 14.9%, BTC-USD 9.1%, XEQT.TO 9.0%, BRK-B 4.6%, AMD 2.3%, F 0.1%, Cash 15.1%">
      <span class="po-allocation-segment" style="flex:25.8;background:var(--ds-hold-1)"></span>
      <span class="po-allocation-segment" style="flex:19.1;background:var(--ds-hold-2)"></span>
      <span class="po-allocation-segment" style="flex:14.9;background:var(--ds-hold-3)"></span>
      <span class="po-allocation-segment" style="flex:9.1;background:var(--ds-hold-4)"></span>
      <span class="po-allocation-segment" style="flex:9;background:var(--ds-hold-5)"></span>
      <span class="po-allocation-segment" style="flex:4.6;background:var(--ds-hold-other)"></span>
      <span class="po-allocation-segment" style="flex:2.3;background:var(--ds-hold-other)"></span>
      <span class="po-allocation-segment" style="flex:0.1;background:var(--ds-hold-other)"></span>
      <span class="po-allocation-segment" style="flex:15.1;background:var(--ds-cash)"></span>
    </div>
    <div class="po-allocation-legend" style="--legend-rows:5">
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-1)"></span><span class="po-legend-label">NVDA</span><span class="po-legend-percent money">25.8%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-2)"></span><span class="po-legend-label">AAPL</span><span class="po-legend-percent money">19.1%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-3)"></span><span class="po-legend-label">VTI</span><span class="po-legend-percent money">14.9%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-4)"></span><span class="po-legend-label">BTC-USD</span><span class="po-legend-percent money">9.1%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-5)"></span><span class="po-legend-label">XEQT.TO</span><span class="po-legend-percent money">9.0%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-other)"></span><span class="po-legend-label">BRK-B</span><span class="po-legend-percent money">4.6%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-other)"></span><span class="po-legend-label">AMD</span><span class="po-legend-percent money">2.3%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-hold-other)"></span><span class="po-legend-label">F</span><span class="po-legend-percent money">0.1%</span></div>
      <div class="po-allocation-stat"><span class="po-legend-dot" style="background:var(--ds-cash)"></span><span class="po-legend-label">Cash</span><span class="po-legend-percent money">15.1%</span></div>
    </div></section></div></div>
</div>
</body>
</html>
