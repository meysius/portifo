<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OptionGrid — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-col"><span class="pv-cap">Display currency</span><div class="pv-phone"><div class="pv-dim"><div class="ds-sheet"><div class="ds-sheet-body"><div class="ds-sheet-grabber" aria-hidden="true"></div><div class="ds-sheet-header"><h2>Display currency</h2><button type="button" class="ds-close-sheet" aria-label="Close dialog"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p class="ds-sheet-notice" style="margin-top:0">Totals and investments are converted to this currency across the app. Cash balances stay in their original currency.</p><div class="ds-sheet-options"><button type="button" class="ds-sheet-option active" aria-pressed="true">USD</button><button type="button" class="ds-sheet-option" aria-pressed="false">EUR</button><button type="button" class="ds-sheet-option" aria-pressed="false">GBP</button><button type="button" class="ds-sheet-option" aria-pressed="false">CAD</button><button type="button" class="ds-sheet-option" aria-pressed="false">AUD</button><button type="button" class="ds-sheet-option" aria-pressed="false">JPY</button><button type="button" class="ds-sheet-option" aria-pressed="false">CHF</button><button type="button" class="ds-sheet-option" aria-pressed="false">SEK</button></div><p class="ds-sheet-notice">Converted at today’s exchange rates.</p></div></div></div></div></div>
</div>
</body>
</html>
