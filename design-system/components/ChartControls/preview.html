<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChartControls — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-col"><span class="pv-cap">Range picker, 6M selected</span><div class="pv-phone" style="padding:0 var(--ds-gutter)">
    <div class="hd-chart-controls"><button type="button" class="hd-range" aria-pressed="false">1D</button><button type="button" class="hd-range" aria-pressed="false">1W</button><button type="button" class="hd-range" aria-pressed="false">1M</button><button type="button" class="hd-range" aria-pressed="false">3M</button><button type="button" class="hd-range" aria-pressed="true">6M</button><button type="button" class="hd-range" aria-pressed="false">1Y</button><button type="button" class="hd-range" aria-pressed="false">All</button></div></div></div>
  <div class="pv-col"><span class="pv-cap">Indicator toggles</span><div class="pv-phone" style="padding:16px var(--ds-gutter)">
    <div class="hd-indicators">
      <button type="button" class="hd-indicator" aria-pressed="true"><span class="hd-indicator-swatch"></span>200-day SMA<span class="money" style="letter-spacing:0">$118.42</span></button>
      <button type="button" class="hd-indicator" aria-pressed="false"><span class="hd-indicator-bands" aria-hidden="true"><span></span><span></span><span></span></span>SMA bands</button>
    </div></div></div>
</div>
</body>
</html>
