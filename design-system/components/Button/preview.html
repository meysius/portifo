<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-col"><span class="pv-cap">Full-width</span><div class="pv-phone" style="padding:0 var(--ds-gutter) 20px">
    <button type="button" class="ds-action">Save changes</button>
    <button type="button" class="ds-action secondary">Clear filters</button>
    <button type="button" class="ds-action" disabled>Create account</button>
  </div></div>
  <div class="pv-col"><span class="pv-cap">Text and icon actions</span><div class="pv-phone" style="padding:16px var(--ds-gutter);display:flex;flex-direction:column;gap:12px;align-items:flex-start">
    <button type="button" class="ds-text-action small" style="padding-left:0">Clear all</button>
    <button type="button" class="ds-text-action"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add currency</button>
    <div style="display:flex;gap:16px;align-items:center"><button type="button" class="ds-icon-button" aria-label="Add transaction"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" class="ds-icon-button quiet" aria-label="Rename account"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5M4 20l4-1L20 7a2 2 0 0 0-3-3L5 16l-1 4Z"/></svg></button></div>
  </div></div>
</div>
</body>
</html>
