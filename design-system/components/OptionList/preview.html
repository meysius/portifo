  <div class="pv-col"><span class="pv-cap">With search</span><div class="pv-phone"><div class="pv-dim"><div class="ds-sheet"><div class="ds-sheet-body"><div class="ds-sheet-grabber" aria-hidden="true"></div><div class="ds-sheet-header"><h2>Filter by symbol</h2><button type="button" class="ds-close-sheet" aria-label="Close dialog"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p class="tl-filter-intro">Choose a security. Cash movements appear under All symbols.</p><div class="tl-search-field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input type="search" aria-label="Search symbols" placeholder="Find a symbol or company…"></div><div role="radiogroup"><label class="tl-filter-option"><input type="radio" name="s" checked><span class="tl-filter-option-copy"><span class="tl-filter-option-title">All symbols</span><span class="tl-filter-option-detail">Includes cash movements</span></span><span class="tl-filter-option-count">48</span></label><label class="tl-filter-option"><input type="radio" name="s"><span class="tl-filter-option-copy"><span class="tl-filter-option-title">NVDA</span><span class="tl-filter-option-detail">NVIDIA Corporation</span></span><span class="tl-filter-option-count">9</span></label><label class="tl-filter-option"><input type="radio" name="s"><span class="tl-filter-option-copy"><span class="tl-filter-option-title">VTI</span><span class="tl-filter-option-detail">Vanguard Total Stock Market ETF</span></span><span class="tl-filter-option-count">5</span></label></div><div class="tl-filter-apply"><button type="button" class="ds-action">Show 48 records</button></div></div></div></div></div></div>
