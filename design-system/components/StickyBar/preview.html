<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StickyBar — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-col"><span class="pv-cap">At rest: no bar</span><div class="pv-phone" style="height:170px">
    <div class="ds-sticky-bar" aria-hidden="true"><span class="ds-sticky-title">Accounts</span></div>
    <div class="ds-heading"><h1>Accounts</h1><button type="button" class="ds-icon-button" aria-label="Add account"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <div class="pv-ghost">Joint brokerage<br>RRSP<br>Everyday cash</div></div></div>
  <div class="pv-col"><span class="pv-cap">Scrolled: the bar takes the title</span><div class="pv-phone" style="height:170px">
    <div class="ds-sticky-bar shown" aria-hidden="true"><span class="ds-sticky-title">Accounts</span></div>
    <div class="pv-ghost" style="padding-top:62px">RRSP<br>Everyday cash<br>Margin account</div></div></div>
</div>
</body>
</html>
