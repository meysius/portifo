<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MetricGrid — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-col"><span class="pv-cap">Split under a hero</span><div class="pv-phone">
    <section class="ds-hero account" style="padding-bottom:23px"><div class="ds-hero-label">Total account value</div><div class="ds-hero-value money">$64,018.77</div></section>
    <div class="ds-split"><div><span class="ds-metric-label">Investments</span><span class="money">$52,340.12</span></div><div><span class="ds-metric-label">Cash</span><span class="money">$11,678.65</span></div></div></div></div>
  <div class="pv-col"><span class="pv-cap">In a section</span><div class="pv-phone">
    <section class="ds-section"><div class="ds-section-heading" style="margin-bottom:17px"><h2>Position</h2></div>
    <div class="ds-grid">
      <div><div class="ds-metric-label">Shares held</div><div class="money">250</div></div>
      <div><div class="ds-metric-label">Average cost / share</div><div class="money">$111.39</div></div>
      <div><div class="ds-metric-label">Total cost</div><div class="money">$27,847.90</div></div>
      <div><div class="ds-metric-label">Average age</div><div class="money">1y 7m</div></div>
    </div></section></div></div>
</div>
</body>
</html>
