<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TaskScreen — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../preview.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-col"><span class="pv-cap">New account</span><div class="pv-phone"><div class="ac-create">
    <div class="ac-form-navigation"><button type="button" class="ac-cancel">Cancel</button><h2>New account</h2><span class="ac-form-navigation-spacer"></span></div>
    <div class="ac-form-body">
      <p class="ac-form-kicker">A new place for your money</p>
      <h3>Make it your own.</h3>
      <p class="ac-form-intro">Add the broker, bank or wallet you already use.<br>No connection or login needed.</p>
      <label class="ds-field-label" for="t1" style="margin-top:0">Account name</label>
      <input id="t1" class="ds-field ac-name-field focus" value="Family RESP">
      <div class="ac-cash-heading"><h4>Opening cash</h4><span class="ac-optional">Optional</span></div>
      <div class="ac-balance-entry"><input class="ds-field" type="number" aria-label="Amount" value="2500.00"><select class="ds-field" aria-label="Currency"><option>CAD</option></select><button type="button" class="ac-remove-balance" aria-label="Remove balance"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
      <button type="button" class="ds-text-action"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add currency</button>
    </div>
    <div class="ac-form-footer"><button type="button" class="ds-action">Create account</button><p>Opening cash is recorded as a deposit, dated today.</p></div>
  </div></div></div>
</div>
</body>
</html>
